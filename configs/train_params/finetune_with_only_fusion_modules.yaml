defaults:
  - default

# Freeze all parameters by default (lr = 0)
lr: 1e-6
min_lr: 1e-7

# Optimizer parameters specific to submodules
submodule_configs:
  # Only train inter-chunk fusion and pose head modules
  inter_chunk_fusion:
    lr: 1e-05
    min_lr: 1e-06
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: ${train_params.weight_decay}
    schedule_type: ${train_params.schedule_type}
  inter_chunk_pose_head:
    lr: 2e-05
    min_lr: 1e-5
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: ${train_params.weight_decay}
    schedule_type: ${train_params.schedule_type}
  pre_fusion_attn_proj:
    lr: 1e-05
    min_lr: 1e-06
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: ${train_params.weight_decay}
    schedule_type: ${train_params.schedule_type}
  semantic_proj:
    lr: 1e-05
    min_lr: 1e-06
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: ${train_params.weight_decay}
    schedule_type: ${train_params.schedule_type}
  dense_head:
    lr: 1e-7
    min_lr: 1e-8
    warmup_epochs: ${train_params.warmup_epochs}
    weight_decay: ${train_params.weight_decay}
    schedule_type: ${train_params.schedule_type}

# Enable warnings for parameters not in any submodule
warn_not_in_submodule: True
